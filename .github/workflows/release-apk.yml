# Только кнопка. Тег теперь поднимает workflow «Релиз» (APK+IPA+EXE).
# Этот файл — запасной: положить уже лежащий public/yurec_xuec.apk в Release.
name: Релиз APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            public/yurec_xuec.apk
            src/data/changelog.json
          sparse-checkout-cone: false

      - id: ver
        run: |
          python3 - <<'PY'
          import json, os
          ver = json.load(open("src/data/changelog.json"))["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={ver}\n")
              f.write(f"tag={ver}\n")
          PY

      - name: Проверка APK
        run: |
          test -f public/yurec_xuec.apk
          ls -lh public/yurec_xuec.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Жизнь Юрца ${{ steps.ver.outputs.version }}
          files: public/yurec_xuec.apk
          fail_on_unmatched_files: true
          make_latest: true
          append_body: true
          body: |
            **Android:** `yurec_xuec.apk` — пакет `ru.yurec.xuec`.
